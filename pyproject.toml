[project]
name = "omnirag-ai"
version = "0.3.0"
description = "Local PDF discovery with hybrid retrieval and source-linked evidence"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "pypdf>=6.10,<7",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "qdrant-client>=1.16,<2",
  "fastembed>=0.8,<0.10",
  "pypdfium2>=4.30,<6",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "reportlab>=4.4,<5"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/omnirag"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
